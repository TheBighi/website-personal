<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Copland OS · Lain login</title>

<style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020021;
    }

    body {
      color: #72dce0;
      font-family: Georgia, "Times New Roman", serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      background: #020021;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* CRT-style overlays */
    .crt {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.55;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 22, 0.1) 0,
        rgba(0, 0, 22, 0.1) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 13vw 2vw rgba(0, 0, 25, 0.25);
    }

    /* Last.fm track display */
    .music {
      padding: 4px 12px 15px 0;
      color: #b5d9ef;
      font-family: monospace;
      line-height: 1.45;
    }

    #status {
      margin: 0 0 10px;
      font-size: 29px;
      letter-spacing: 3px;
    }

    #song-title {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      overflow-wrap: anywhere;
      font-size: 32px;
      line-height: 1.3;
      letter-spacing: 1px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    #artist {
      margin: 8px 0 0;
      font-size: 23px;
      opacity: 0.72;
    }

    /* Small activity indicator shown while Last.fm is being refreshed */
    .sync-indicator {
      position: fixed;
      right: 30px;
      bottom: 27px;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    body[data-ready="true"] .sync-indicator {
      opacity: 0.22;
    }

    .sync-indicator i {
      display: block;
      width: 3px;
      height: 5px;
      background: #9af3ef;
      border-radius: 1px;
      transform-origin: center;
    }

    body[data-ready="true"] .sync-indicator.fetching {
      opacity: 0.9;
    }

    .sync-indicator.fetching i {
      animation: signal 0.6s ease-in-out infinite;
      box-shadow: 0 0 8px #8ceaf4;
    }

    .sync-indicator i:nth-child(2) {
      animation-delay: -0.12s;
    }

    .sync-indicator i:nth-child(3) {
      animation-delay: -0.24s;
    }

    .sync-indicator i:nth-child(4) {
      animation-delay: -0.36s;
    }

    .sync-indicator i:nth-child(5) {
      animation-delay: -0.48s;
    }

    @keyframes signal {
      0%,
      100% {
        transform: scaleY(0.6);
      }

      50% {
        transform: scaleY(3);
      }
    }

    @media (max-width: 650px) {
      .sync-indicator {
        right: 22px;
        bottom: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sync-indicator.fetching i {
        height: 10px;
        animation: none;
      }
    }
  </style>

</head>

<script>
    /*
     * Copland OS / Lain-style login animation
     *
     * Sections:
     * 1. Configuration and helpers
     * 2. SVG energy particles
     * 3. Main animation renderer
     * 4. Synthesized boot sound
     * 5. Last.fm polling
     * 6. Playback controls
     */

    const LAST_FM_API_KEY = "4d288c1c7310848430dd818561af10c7";
    const LAST_FM_USER = "TheBighi";

    const ANIMATION_DURATION_SECONDS = 12;
    const INITIAL_MUSIC_DELAY_MS = 2500;
    const MUSIC_REFRESH_INTERVAL_MS = 5000;
    const MUSIC_REQUEST_TIMEOUT_MS = 4500;
    const FETCH_INDICATOR_MINIMUM_MS = 700;

    (() => {
      "use strict";

      const SVG_NAMESPACE = "http://www.w3.org/2000/svg";
      const ENERGY_PARTICLE_COUNT = 44;
      const WAVE_POINT_COUNT = 138;
      const PHASE_TONES = [220, 640, 880, 440];

      // -----------------------------------------------------------------------
      // DOM and math helpers
      // -----------------------------------------------------------------------

      const byId = (id) => document.getElementById(id);

      const setAttribute = (id, name, value) => {
        byId(id).setAttribute(name, value);
      };

      const setNodeAttribute = (node, name, value) => {
        node.setAttribute(name, value);
      };

      const setOpacity = (id, value) => {
        byId(id).setAttribute("opacity", value.toFixed(4));
      };

      const clamp01 = (value) => Math.max(0, Math.min(1, value));

      const smoothStep = (value) => {
        const x = clamp01(value);
        return x * x * (3 - 2 * x);
      };

      const ramp = (time, start, end) => {
        return smoothStep((time - start) / (end - start));
      };

      const lerp = (start, end, amount) => {
        return start + (end - start) * amount;
      };

      // -----------------------------------------------------------------------
      // SVG energy particles
      // -----------------------------------------------------------------------

      const energyParticles = [];

      function createEnergyParticles() {
        const energyGroup = byId("energy");

        for (let index = 0; index < ENERGY_PARTICLE_COUNT; index++) {
          const group = document.createElementNS(SVG_NAMESPACE, "g");
          const tail = document.createElementNS(SVG_NAMESPACE, "path");
          const dot = document.createElementNS(SVG_NAMESPACE, "ellipse");

          tail.setAttribute("stroke", "#5dd9e8");
          tail.setAttribute("stroke-width", "2");
          tail.setAttribute("fill", "none");

          const dotRadius = 4 + (index % 4) * 2;
          dot.setAttribute("rx", dotRadius);
          dot.setAttribute("ry", dotRadius);
          dot.setAttribute("filter", "url(#bloom)");

          group.append(tail, dot);
          energyGroup.append(group);
          energyParticles.push({ group, tail, dot });
        }
      }

      // -----------------------------------------------------------------------
      // Main animation renderer
      // -----------------------------------------------------------------------

      function renderBackground(timeline, assembleProgress, finishProgress) {
        const backgroundRgb = [
          lerp(2, 49, finishProgress),
          lerp(0, 78, finishProgress),
          lerp(33, 149, finishProgress),
        ].map(Math.round);

        const backgroundColor = `rgb(${backgroundRgb.join(",")})`;

        setAttribute("background", "fill", backgroundColor);
        document.querySelector(".screen").style.background = backgroundColor;

        setOpacity("backHalo", 1 - finishProgress * 0.9);

        setAttribute("railBar", "x", lerp(84, 66, finishProgress));
        setAttribute("railBar", "width", lerp(92, 72, finishProgress));

        const railRed = Math.round(lerp(7, 107, finishProgress));
        const railGreen = Math.round(lerp(80, 194, finishProgress));
        const railBlue = Math.round(lerp(100, 173, finishProgress));

        setAttribute(
          "railBar",
          "fill",
          `rgb(${railRed},${railGreen},${railBlue})`
        );

        setOpacity("railLine", 0.5 * (1 - finishProgress));
        setOpacity("bootBrand", 1 - ramp(timeline, 8.5, 10));

        const emblemScale = lerp(1.05, 0.43, finishProgress);
        const emblemX = lerp(735, 930, finishProgress);
        const emblemY = lerp(480, 410, finishProgress);

        setAttribute(
          "emblem",
          "transform",
          `translate(${emblemX} ${emblemY}) scale(${emblemScale})`
        );

        setOpacity(
          "emblem",
          lerp(1, 0.78, assembleProgress) * (1 - finishProgress) +
            finishProgress * 0.95
        );
      }

      function renderLoginPanels(
        timeline,
        assembleProgress,
        authorizationProgress,
        dissolveProgress
      ) {
        setOpacity("panels", assembleProgress * dissolveProgress);

        const loginX = lerp(505, 755, authorizationProgress);
        const loginY = lerp(385, 480, authorizationProgress);
        const loginRotation = lerp(-8, 0, authorizationProgress);

        const loginScaleX =
          lerp(0.06, 1, assembleProgress) *
          lerp(1, 1.31, authorizationProgress);

        const loginScaleY = lerp(0.06, 1, assembleProgress);

        setAttribute(
          "loginDisc",
          "transform",
          `translate(${loginX} ${loginY}) rotate(${loginRotation}) scale(${loginScaleX} ${loginScaleY})`
        );

        setAttribute(
          "kernelDisc",
          "transform",
          `translate(1090 ${lerp(330, 276, assembleProgress)}) scale(${lerp(
            0.02,
            1,
            assembleProgress
          )})`
        );

        setAttribute(
          "voiceDisc",
          "transform",
          `translate(994 ${lerp(870, 805, assembleProgress)}) scale(${lerp(
            0.02,
            1,
            assembleProgress
          )})`
        );

        setOpacity("voiceDisc", 1 - authorizationProgress);
        setOpacity("guides", assembleProgress * dissolveProgress * 0.7);

        setAttribute("loginRule", "pathLength", "1");
        setAttribute("loginRule", "stroke-dasharray", "1");
        setAttribute("loginRule", "stroke-dashoffset", 1 - assembleProgress);

        setOpacity("loginRule", 1 - authorizationProgress);
        setOpacity("voiceRule", 1 - authorizationProgress);

        setOpacity("loginLabels", ramp(timeline, 2.9, 4) * dissolveProgress);

        byId("loginLabels").children[0].setAttribute(
          "opacity",
          1 - authorizationProgress
        );

        setOpacity("voiceLabel", 1 - authorizationProgress);
      }

      function renderAuthorization(
        timeline,
        authorizationProgress,
        dissolveProgress
      ) {
        setOpacity("authorize", authorizationProgress * dissolveProgress);

        setAttribute(
          "authorize",
          "transform",
          `translate(0 ${lerp(22, 0, authorizationProgress)})`
        );

        setOpacity("welcome", ramp(timeline, 6.7, 7.4));
      }

      function renderEnergyParticles(timeline) {
        const visibleAmount =
          ramp(timeline, 3.5, 4.4) *
          (1 - ramp(timeline, 7.8, 9.5)) *
          0.55;

        setOpacity("energy", visibleAmount);

        energyParticles.forEach(({ group, tail, dot }, index) => {
          const angle = index * 2.399 + timeline * 0.37;
          const phase = (timeline * 0.22 + index * 0.137) % 1;
          const radius = 28 + phase * (index < 16 ? 144 : 355);

          const centerX = index < 16 ? 1072 : 720;
          const centerY = index < 16 ? 224 : 476;

          const x = centerX + Math.cos(angle) * radius;
          const y = centerY + Math.sin(angle) * radius * 0.75;

          setNodeAttribute(group, "opacity", Math.sin(phase * Math.PI) * 0.8);
          setNodeAttribute(dot, "cx", x);
          setNodeAttribute(dot, "cy", y);

          setNodeAttribute(
            dot,
            "transform",
            `rotate(${(angle * 180) / Math.PI + 90} ${x} ${y})`
          );

          setNodeAttribute(
            tail,
            "d",
            `M${x} ${y}l${-Math.cos(angle) * 28} ${-Math.sin(angle) * 21}`
          );
        });
      }

      function renderVoiceWave(timeline, authorizationProgress) {
        setOpacity(
          "waveGroup",
          ramp(timeline, 3.9, 4.6) * (1 - authorizationProgress)
        );

        let path = "";

        for (let index = 0; index < WAVE_POINT_COUNT; index++) {
          const envelope =
            0.35 +
            0.65 *
              Math.sin((index / (WAVE_POINT_COUNT - 1)) * Math.PI);

          const amplitude =
            (10 +
              32 *
                Math.pow(
                  Math.sin(index * 0.063 + timeline * 1.6),
                  4
                )) *
            envelope;

          const x = 688 + index * 4.05;
          const y =
            790 + Math.sin(index * 2.3 + timeline * 13) * amplitude;

          path +=
            (index === 0 ? "M" : "L") +
            x.toFixed(1) +
            " " +
            y.toFixed(1);
        }

        setAttribute("wave", "d", path);
      }

      function updateStageName(timeline) {
        if (timeline < 2.1) {
          document.body.dataset.stage = "boot";
        } else if (timeline < 5.75) {
          document.body.dataset.stage = "login";
        } else if (timeline < 8.4) {
          document.body.dataset.stage = "authorize";
        } else {
          document.body.dataset.stage = "desktop";
        }
      }

      function render(seconds) {
        const timeline = (seconds / ANIMATION_DURATION_SECONDS) * 12;

        const assembleProgress = ramp(timeline, 2.1, 3.9);
        const authorizationProgress = ramp(timeline, 5.75, 6.85);
        const finishProgress = ramp(timeline, 8.4, 11.5);
        const dissolveProgress = 1 - ramp(timeline, 8.4, 9.8);

        renderBackground(timeline, assembleProgress, finishProgress);

        renderLoginPanels(
          timeline,
          assembleProgress,
          authorizationProgress,
          dissolveProgress
        );

        renderAuthorization(
          timeline,
          authorizationProgress,
          dissolveProgress
        );

        renderEnergyParticles(timeline);
        renderVoiceWave(timeline, authorizationProgress);

        setOpacity("desktop", ramp(timeline, 9.6, 11.6));
        updateStageName(timeline);
      }

      // -----------------------------------------------------------------------
      // Synthesized boot sound
      // -----------------------------------------------------------------------

      let audioContext = null;
      let masterGain = null;
      let audioInitialized = false;
      let lastSoundPhase = -1;

      function createSoundSystem() {
        if (audioInitialized) return;

        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        audioContext = new AudioContextClass();

        masterGain = audioContext.createGain();
        masterGain.gain.value = 0.25;
        masterGain.connect(audioContext.destination);

        const humGain = audioContext.createGain();
        humGain.gain.value = 0.045;
        humGain.connect(masterGain);

        [55, 110, 164.8].forEach((frequency, index) => {
          const oscillator = audioContext.createOscillator();

          oscillator.type = index === 1 ? "triangle" : "sine";
          oscillator.frequency.value = frequency;
          oscillator.connect(humGain);
          oscillator.start();
        });

        const noiseBuffer = audioContext.createBuffer(
          1,
          audioContext.sampleRate * 3,
          audioContext.sampleRate
        );

        const noiseData = noiseBuffer.getChannelData(0);

        for (let index = 0; index < noiseData.length; index++) {
          noiseData[index] = Math.random() * 2 - 1;
        }

        const noiseSource = audioContext.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        noiseSource.loop = true;

        const noiseFilter = audioContext.createBiquadFilter();
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.value = 1100;
        noiseFilter.Q.value = 0.75;

        const noiseGain = audioContext.createGain();
        noiseGain.gain.value = 0.023;

        noiseSource.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(masterGain);
        noiseSource.start();

        const lfo = audioContext.createOscillator();
        const lfoDepth = audioContext.createGain();

        lfo.frequency.value = 0.17;
        lfoDepth.gain.value = 550;

        lfo.connect(lfoDepth);
        lfoDepth.connect(noiseFilter.frequency);
        lfo.start();

        audioInitialized = true;
      }

      function enableSound() {
        try {
          createSoundSystem();

          if (audioContext && audioContext.state !== "running") {
            audioContext.resume().catch(() => {});
          }
        } catch {
          // Decorative audio should never break the page.
        }
      }

      function playTone(frequency = 740, length = 0.17) {
        if (!audioContext || audioContext.state !== "running") return;

        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(
          frequency * 0.72,
          now + length
        );

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + length);

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(now);
        oscillator.stop(now + length + 0.02);

        oscillator.onended = () => {
          oscillator.disconnect();
          gain.disconnect();
        };
      }

      function unlockSound() {
        if (audioContext?.state !== "running") {
          enableSound();
        }
      }

      document.addEventListener("pointerdown", unlockSound);
      document.addEventListener("keydown", unlockSound);

      // -----------------------------------------------------------------------
      // Last.fm polling
      // -----------------------------------------------------------------------

      let musicRefreshTimer = 0;
      let indicatorTimer = 0;
      let activeMusicRequest = null;
      let musicRequestVersion = 0;
      let hasTrack = false;

      function updateMusicText(status, song = "", artist = "") {
        const values = [
          ["status", status],
          ["song-title", song],
          ["artist", artist],
        ];

        for (const [id, text] of values) {
          const element = byId(id);

          if (element.textContent !== text) {
            element.textContent = text;
          }
        }

        byId("song-title").title = song;
      }

      function resetMusicSearch() {
        clearTimeout(musicRefreshTimer);
        clearTimeout(indicatorTimer);

        activeMusicRequest?.abort();
        activeMusicRequest = null;

        musicRequestVersion++;
        hasTrack = false;

        byId("sync-indicator").classList.remove("fetching");
        updateMusicText("Searching...");
      }

      function getArtistName(track) {
        if (typeof track.artist === "string") {
          return track.artist;
        }

        return track.artist?.["#text"] || track.artist?.name || "";
      }

      async function fetchMusic(version) {
        if (
          version !== musicRequestVersion ||
          !isReady ||
          activeMusicRequest
        ) {
          return;
        }

        const requestStartedAt = performance.now();
        const controller = new AbortController();

        activeMusicRequest = controller;

        clearTimeout(indicatorTimer);
        byId("sync-indicator").classList.add("fetching");

        const requestTimeout = setTimeout(() => {
          controller.abort();
        }, MUSIC_REQUEST_TIMEOUT_MS);

        try {
          const params = new URLSearchParams({
            method: "user.getrecenttracks",
            user: LAST_FM_USER,
            api_key: LAST_FM_API_KEY,
            format: "json",
            limit: "1",
          });

          const response = await fetch(
            `https://ws.audioscrobbler.com/2.0/?${params}`,
            {
              signal: controller.signal,
              cache: "no-store",
            }
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          if (data.error) {
            throw new Error(data.message || "Last.fm error");
          }

          if (version !== musicRequestVersion) return;

          const tracks = data.recenttracks?.track;
          const track = Array.isArray(tracks) ? tracks[0] : tracks;

          if (!track?.name) {
            hasTrack = false;
            updateMusicText("No recent tracks.");
            return;
          }

          const status =
            track["@attr"]?.nowplaying === "true"
              ? "Now Playing:"
              : "Last Played:";

          hasTrack = true;
          updateMusicText(status, track.name, getArtistName(track));
        } catch {
          if (version !== musicRequestVersion) return;

          if (!hasTrack) {
            updateMusicText(
              "Connection unavailable.",
              "Reconnecting..."
            );
          }
        } finally {
          clearTimeout(requestTimeout);

          if (activeMusicRequest === controller) {
            activeMusicRequest = null;
          }

          if (version === musicRequestVersion && isReady) {
            const elapsed = performance.now() - requestStartedAt;

            indicatorTimer = setTimeout(() => {
              byId("sync-indicator").classList.remove("fetching");
            }, Math.max(0, FETCH_INDICATOR_MINIMUM_MS - elapsed));

            musicRefreshTimer = setTimeout(() => {
              fetchMusic(version);
            }, Math.max(0, MUSIC_REFRESH_INTERVAL_MS - elapsed));
          }
        }
      }

      function startMusicSearch() {
        resetMusicSearch();

        const version = musicRequestVersion;

        musicRefreshTimer = setTimeout(() => {
          fetchMusic(version);
        }, INITIAL_MUSIC_DELAY_MS);
      }

      // -----------------------------------------------------------------------
      // Animation playback
      // -----------------------------------------------------------------------

      let animationPosition = 0;
      let isPlaying = false;
      let previousFrameTime = 0;
      let animationFrameId = 0;
      let isReady = false;

      function finishBootSequence() {
        if (isReady) return;

        isReady = true;
        document.body.dataset.ready = "true";

        startMusicSearch();
        playTone(1046, 0.65);

        document.dispatchEvent(new CustomEvent("lain:ready"));
      }

      function getSoundPhase(position) {
        if (position < 2.1) return 0;
        if (position < 5.75) return 1;
        if (position < 8.4) return 2;
        return 3;
      }

      function animationStep(now) {
        if (!isPlaying) return;

        if (previousFrameTime) {
          const deltaSeconds = (now - previousFrameTime) / 1000;

          animationPosition = Math.min(
            ANIMATION_DURATION_SECONDS,
            animationPosition + deltaSeconds
          );
        }

        previousFrameTime = now;
        render(animationPosition);

        const currentSoundPhase = getSoundPhase(animationPosition);

        if (currentSoundPhase !== lastSoundPhase) {
          lastSoundPhase = currentSoundPhase;
          playTone(PHASE_TONES[currentSoundPhase], 0.35);
        }

        if (animationPosition < ANIMATION_DURATION_SECONDS) {
          animationFrameId = requestAnimationFrame(animationStep);
        } else {
          isPlaying = false;
          finishBootSequence();
        }
      }

      function pause() {
        isPlaying = false;
        cancelAnimationFrame(animationFrameId);
        previousFrameTime = 0;
      }

      function play() {
        if (animationPosition >= ANIMATION_DURATION_SECONDS) {
          replay();
          return;
        }

        if (isPlaying) return;

        isPlaying = true;
        previousFrameTime = 0;
        animationFrameId = requestAnimationFrame(animationStep);
      }

      function seek(seconds) {
        animationPosition = Math.max(
          0,
          Math.min(ANIMATION_DURATION_SECONDS, Number(seconds) || 0)
        );

        previousFrameTime = 0;
        render(animationPosition);

        if (animationPosition >= ANIMATION_DURATION_SECONDS) {
          finishBootSequence();
        }
      }

      function replay() {
        pause();

        isReady = false;
        lastSoundPhase = -1;
        document.body.dataset.ready = "false";

        resetMusicSearch();
        seek(0);
        play();
      }

      document.addEventListener("visibilitychange", () => {
        previousFrameTime = 0;

        if (!document.hidden) {
          enableSound();
        }
      });

      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          replay();
        }
      });

      window.lainLogin = {
        replay,
        seek,
        pause,
        play,

        get duration() {
          return ANIMATION_DURATION_SECONDS;
        },

        get position() {
          return animationPosition;
        },
      };

      createEnergyParticles();
      render(0);
      enableSound();
      play();
    })();
  </script>

</body>
